name: Add professional capabilities profile

on:
  push:
    paths:
      - '.github/workflows/add-capabilities-profile.yml'

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add capabilities and experience section
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          marker = '<div class="page-view" data-view="projects"'
          section = r'''
          <section class="section capabilities-section" id="capabilities">
            <div class="container">
              <div class="section-heading capabilities-heading reveal">
                <p class="section-kicker" data-ar="قدراتنا وخبراتنا" data-en="Capabilities & Experience">قدراتنا وخبراتنا</p>
                <h2 class="section-title" data-ar="خبرة ميدانية وجاهزية تشغيلية لتنفيذ أعمال المصاعد" data-en="Field experience and operational readiness for elevator projects">خبرة ميدانية وجاهزية تشغيلية لتنفيذ أعمال المصاعد</h2>
                <div class="gold-rule"></div>
                <p data-ar="تجمع مؤسسة برج للمصاعد بين الخبرة الفنية والكوادر الميدانية والجاهزية اللوجستية لدعم أعمال التركيب والصيانة والتحديث في مواقع المشاريع." data-en="Burj Elevators combines technical experience, field resources, and logistical readiness to support installation, maintenance, and modernization projects.">تجمع مؤسسة برج للمصاعد بين الخبرة الفنية والكوادر الميدانية والجاهزية اللوجستية لدعم أعمال التركيب والصيانة والتحديث في مواقع المشاريع.</p>
              </div>
              <div class="capabilities-grid reveal">
                <article class="capability-card"><strong dir="ltr">+8</strong><h3 data-ar="سنوات خبرة" data-en="Years of experience">سنوات خبرة</h3><p data-ar="خبرة عملية تمتد لأكثر من ثماني سنوات في مجال المصاعد وأعمالها الفنية والميدانية." data-en="More than eight years of practical experience in elevator systems and field operations.">خبرة عملية تمتد لأكثر من ثماني سنوات في مجال المصاعد وأعمالها الفنية والميدانية.</p></article>
                <article class="capability-card"><strong dir="ltr">Schindler 3300</strong><h3 data-ar="أنظمة بدون غرفة ماكينة" data-en="Machine-room-less systems">أنظمة بدون غرفة ماكينة</h3><p data-ar="خبرة في أعمال مصاعد Schindler 3300 من فئة Machine Room-Less (MRL)." data-en="Experience with Schindler 3300 Machine Room-Less (MRL) elevator systems.">خبرة في أعمال مصاعد Schindler 3300 من فئة Machine Room-Less (MRL).</p></article>
                <article class="capability-card"><strong dir="ltr">10</strong><h3 data-ar="مصاعد شندلر – نجران" data-en="Schindler elevators – Najran">مصاعد شندلر – نجران</h3><p data-ar="خبرة ميدانية ضمن أعمال عشرة مصاعد شندلر في نجران." data-en="Field experience involving work on ten Schindler elevators in Najran.">خبرة ميدانية ضمن أعمال عشرة مصاعد شندلر في نجران.</p></article>
                <article class="capability-card"><strong dir="ltr">11</strong><h3 data-ar="قوة تشغيلية متاحة" data-en="Available operational workforce">قوة تشغيلية متاحة</h3><p data-ar="خمسة عمال على كفالة المؤسسة وستة عمال عبر منصة أجير، بما يدعم مرونة توزيع الفرق حسب متطلبات المشاريع." data-en="Five sponsored workers and six workers engaged through Ajeer, supporting flexible workforce deployment according to project needs.">خمسة عمال على كفالة المؤسسة وستة عمال عبر منصة أجير، بما يدعم مرونة توزيع الفرق حسب متطلبات المشاريع.</p></article>
                <article class="capability-card"><strong class="capability-icon">↔</strong><h3 data-ar="جاهزية لوجستية" data-en="Logistical readiness">جاهزية لوجستية</h3><p data-ar="سيارات متوفرة لتنقل العمالة والفرق الفنية بين مواقع العمل ودعم الاستجابة التشغيلية." data-en="Vehicles are available for workforce and technical-team transportation between project sites.">سيارات متوفرة لتنقل العمالة والفرق الفنية بين مواقع العمل ودعم الاستجابة التشغيلية.</p></article>
              </div>
            </div>
          </section>
          '''

          if 'id="capabilities"' not in html:
              if marker not in html:
                  raise SystemExit('Projects page marker not found; refusing unsafe edit')
              html = html.replace(marker, section + '\n' + marker, 1)
              index.write_text(html, encoding='utf-8')

          css_path = Path('assets/css/styles.css')
          css = css_path.read_text(encoding='utf-8')
          css_add = r'''

          /* Capabilities & experience */
          .capabilities-section{background:linear-gradient(180deg,#f8fafc 0%,#fff 100%)}
          .capabilities-heading{max-width:820px;margin-inline:auto;text-align:center}
          .capabilities-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:18px;margin-top:34px}
          .capability-card{background:#fff;border:1px solid rgba(10,36,79,.12);border-radius:18px;padding:24px 20px;box-shadow:0 12px 34px rgba(10,36,79,.07);text-align:center}
          .capability-card strong{display:block;color:#e98b2a;font-size:clamp(1.7rem,3vw,2.5rem);line-height:1.1;margin-bottom:12px;font-weight:800;unicode-bidi:isolate}
          .capability-card h3{color:#0b2b59;margin:0 0 9px;font-size:1.04rem}
          .capability-card p{margin:0;color:#5b687b;font-size:.93rem;line-height:1.8}
          .capability-icon{font-size:2.5rem!important}
          @media (max-width:1100px){.capabilities-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
          @media (max-width:700px){.capabilities-grid{grid-template-columns:1fr 1fr;gap:12px}.capability-card{padding:20px 14px}.capability-card:last-child{grid-column:1/-1}}
          @media (max-width:430px){.capabilities-grid{grid-template-columns:1fr}.capability-card:last-child{grid-column:auto}}
          '''
          if '/* Capabilities & experience */' not in css:
              css_path.write_text(css + css_add, encoding='utf-8')

      - name: Commit portfolio update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/css/styles.css
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Add capabilities and operational experience section"
            git push
          fi