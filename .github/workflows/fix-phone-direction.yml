name: Fix phone number direction

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-phone-direction.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix phone number display in RTL
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          for number in ('056 393 8316', '056 474 9486'):
              text = text.replace(
                  f'<p>{number}</p>',
                  f'<p><bdi class="phone-number" dir="ltr">{number}</bdi></p>'
              )
              text = text.replace(
                  f'<span>{number}</span>',
                  f'<span><bdi class="phone-number" dir="ltr">{number}</bdi></span>'
              )

          old = '<span data-ar="واتساب: 056 393 8316" data-en="WhatsApp: 056 393 8316">واتساب: 056 393 8316</span>'
          new = '<span><span data-ar="واتساب:" data-en="WhatsApp:">واتساب:</span> <bdi class="phone-number" dir="ltr">056 393 8316</bdi></span>'
          text = text.replace(old, new)
          index.write_text(text, encoding='utf-8')

          css = Path('assets/css/styles.css')
          styles = css.read_text(encoding='utf-8')
          rule = '\n\n/* Keep phone numbers readable inside RTL layouts */\n.phone-number { direction: ltr; unicode-bidi: isolate; display: inline-block; white-space: nowrap; font-variant-numeric: tabular-nums; }\n'
          if '.phone-number {' not in styles:
              css.write_text(styles + rule, encoding='utf-8')
      - name: Commit corrected phone numbers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/css/styles.css
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Fix phone number display in Arabic RTL layout"
            git push
          fi
