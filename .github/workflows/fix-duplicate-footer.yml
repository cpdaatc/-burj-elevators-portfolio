name: Fix mobile page structure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-duplicate-footer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair page-view nesting
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          about = '<div class="page-view" data-view="about" hidden>'
          capabilities = '<section class="section capabilities-section" id="capabilities">'
          projects = '<div class="page-view" data-view="projects" hidden>'
          contact = '<div class="page-view" data-view="contact" hidden>'

          about_i = html.index(about)
          cap_i = html.index(capabilities)
          projects_i = html.index(projects)

          # Capabilities was accidentally placed outside the About page.
          between_about_cap = html[about_i:cap_i]
          if between_about_cap.rstrip().endswith('</div>'):
              prefix = html[:cap_i]
              trimmed = prefix.rstrip()
              trimmed = trimmed[:-len('</div>')]
              cap_block = html[cap_i:projects_i].rstrip()
              html = trimmed + '\n' + cap_block + '\n</div>\n\n' + html[projects_i:]

          # Projects was missing its page-view closing tag, nesting Contact inside it.
          projects_i = html.index(projects)
          contact_i = html.index(contact)
          between_projects_contact = html[projects_i:contact_i]
          if between_projects_contact.rstrip().endswith('</section>'):
              html = html[:contact_i].rstrip() + '\n</div>\n\n' + html[contact_i:]

          # Structural guards.
          assert html.index(about) < html.index(capabilities) < html.index(projects) < html.index(contact)
          cap_end = html.index('</section>', html.index(capabilities)) + len('</section>')
          assert html[cap_end:html.index(projects)].strip() == '</div>'
          contact_i = html.index(contact)
          project_end = html.rfind('</section>', html.index(projects), contact_i) + len('</section>')
          assert html[project_end:contact_i].strip() == '</div>'

          path.write_text(html, encoding='utf-8')

      - name: Commit correction
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix mobile page navigation structure"
          git push