name: Update visible technical team profile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-duplicate-footer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm regression before change
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          old_heading = 'أيدٍ سعودية وخبرات ميدانية'
          new_heading = 'فريق فني متخصص بإشراف خبرة تمتد لنحو 20 عامًا'
          assert old_heading in html, 'Expected old team heading was not found'
          assert new_heading not in html, 'Visible team section is already updated'
          print('RED confirmed: visible team section still contains the old profile text')

      - name: Update visible team section
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          old_heading = '<h2 data-ar="أيدٍ سعودية وخبرات ميدانية" data-en="Saudi leadership, hands-on expertise">أيدٍ سعودية وخبرات ميدانية</h2>'
          new_heading = '<h2 data-ar="فريق فني متخصص بإشراف خبرة تمتد لنحو 20 عامًا" data-en="A specialist technical team led by nearly 20 years of Schindler experience">فريق فني متخصص بإشراف خبرة تمتد لنحو 20 عامًا</h2>'

          old_paragraph = '<p data-ar="فريق فني ثابت يتولى التركيب والصيانة بنفسه، من أول لحام في الهيكل الحديدي حتى تسليم الكابينة جاهزة للتشغيل." data-en="A permanent technical team that handles installation and maintenance itself, from the first weld on the steel structure to handing over a cabin ready to run.">فريق فني ثابت يتولى التركيب والصيانة بنفسه، من أول لحام في الهيكل الحديدي حتى تسليم الكابينة جاهزة للتشغيل.</p>'
          new_paragraph = '<p data-ar="تضم القوة التشغيلية للمؤسسة 11 فردًا: 5 فنيين أساسيين و6 عمال بنظام أجير للدعم والمساندة، بقيادة المشرف العام على الفنيين السيد محمد حسين محمد حسين، بخبرة تقارب 20 عامًا لدى شركة شندلر العليان للمصاعد المحدودة، مع خبرات فنية في أعمال مصاعد شندلر وأوتيس وكوني." data-en="Burj Elevators has an operational workforce of 11: five core technicians and six Ajeer workers providing project support, led by General Technical Supervisor Mr. Mohamed Hussein Mohamed Hussein, with nearly 20 years of experience at Schindler Olayan Elevator Co., alongside technical experience across Schindler, Otis, and Kone elevator systems.">تضم القوة التشغيلية للمؤسسة 11 فردًا: 5 فنيين أساسيين و6 عمال بنظام أجير للدعم والمساندة، بقيادة المشرف العام على الفنيين السيد محمد حسين محمد حسين، بخبرة تقارب 20 عامًا لدى شركة شندلر العليان للمصاعد المحدودة، مع خبرات فنية في أعمال مصاعد شندلر وأوتيس وكوني.</p>'

          assert html.count(old_heading) == 1, 'Old team heading did not match exactly once'
          assert html.count(old_paragraph) == 1, 'Old team paragraph did not match exactly once'
          html = html.replace(old_heading, new_heading, 1)
          html = html.replace(old_paragraph, new_paragraph, 1)
          path.write_text(html, encoding='utf-8')

      - name: Verify updated content and page structure
        shell: python
        run: |
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          assert 'فريق فني متخصص بإشراف خبرة تمتد لنحو 20 عامًا' in html
          assert 'محمد حسين محمد حسين' in html
          assert '11 فردًا: 5 فنيين أساسيين و6 عمال بنظام أجير' in html
          assert 'شركة شندلر العليان للمصاعد المحدودة' in html
          assert 'شندلر وأوتيس وكوني' in html
          assert 'أيدٍ سعودية وخبرات ميدانية' not in html
          assert '<section class="section capabilities-section" id="capabilities">' in html
          assert html.count('class="page-view" data-view=') == 4
          print('GREEN: visible team profile and page structure verified')

      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update visible technical team profile"
          git push